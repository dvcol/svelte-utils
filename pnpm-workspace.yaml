minimumReleaseAge: 10080 # 7 days; 7 × 24 × 60 = 10080
shellEmulator: true

trustPolicy: no-downgrade

allowBuilds:
  '@parcel/watcher': true
  svelte-preprocess: true

overrides:
  chokidar: ^5.0.0 # 4.0.3 dropped provenance; remove override once a later 4.x publishes with attestation
  semver: ^7.7.0 # standard-version pulls semver@6 without provenance; force 7.x which has attestation
onlyBuiltDependencies:
  - '@sveltejs/kit'
